# Render Blueprint for Learning Lens backend (backend-only repo).
# Deploy: push to GitHub, then Render Dashboard -> New -> Blueprint -> select repo.
# Render provisions the API + Postgres and wires DATABASE_URL automatically.
services:
  - type: web
    name: learning-lens-api
    runtime: python
    plan: free
    buildCommand: "pip install --upgrade pip && pip install ."
    startCommand: "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers"
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: APP_ENV
        value: production
      - key: APP_VERSION
        value: 1.0.0
      - key: DEMO_MODE
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: learning-lens-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      # Update this in the Render dashboard after you deploy your frontend
      # (Vercel / Render Static / etc). Comma-separated list is supported.
      - key: FRONTEND_URL
        value: https://your-frontend.onrender.com
      - key: AI_PROVIDER
        value: mock
      - key: AI_MODEL
        value: mock-educator-v1
      - key: AI_API_KEY
        sync: false
      - key: AI_BASE_URL
        sync: false
      - key: AI_TIMEOUT_SECONDS
        value: "60"
      - key: WEAK_THRESHOLD
        value: "0.50"
      - key: DEVELOPING_THRESHOLD
        value: "0.70"
      - key: STRONG_THRESHOLD
        value: "0.85"

databases:
  - name: learning-lens-db
    databaseName: diagnostics
    user: diagnostics
    plan: free
