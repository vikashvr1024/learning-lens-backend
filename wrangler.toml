# Cloudflare Workers + Containers config for the FastAPI backend.
# The Worker (worker/src/index.ts) routes all traffic to one container
# running this repo's Dockerfile (uvicorn on port 8000).
name = "learning-lens-backend"
main = "worker/src/index.js"
compatibility_date = "2026-09-09"
compatibility_flags = ["nodejs_compat"]

[[containers]]
class_name = "Backend"
image = "./Dockerfile"
max_instances = 2

[[durable_objects.bindings]]
name = "BACKEND"
class_name = "Backend"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Backend"]

[observability]
enabled = true

# Non-secret config baked into the Worker and passed to the container.
# Secrets (DATABASE_URL, SECRET_KEY, AI_API_KEY) are set separately via
# `wrangler secret put` or the dashboard — never commit them here.
[vars]
APP_ENV = "production"
APP_VERSION = "1.0.0"
DEMO_MODE = "true"
AI_PROVIDER = "gemini"
AI_MODEL = "gemini-3.1-flash-lite"
AI_TIMEOUT_SECONDS = "60"
WEAK_THRESHOLD = "0.50"
DEVELOPING_THRESHOLD = "0.70"
STRONG_THRESHOLD = "0.85"
# Update after deploy: your frontend origin(s), comma-separated supported.
FRONTEND_URL = "https://your-frontend.onrender.com"
